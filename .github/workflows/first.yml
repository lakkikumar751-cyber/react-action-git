name: "first workflow"
on: 
  push:
  pull_request:
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup node js in platform
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: npm

            - name: install dependency
              run: npm ci

            - name: run eslint
              run: npm run lint

            - name: make react build 
              run: npm run build

            - name: create artifacts
              uses: actions/upload-artifacts@v4
              with:
                  name: raact-build
                  path: dist/
                  retention-days: 8