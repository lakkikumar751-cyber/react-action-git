name: Deploy app on s3 aws
on: push
jobs: 
    deploy:
        runs-on: ubuntu-latest

        steps: 
        - name: checkcode code
          uses: actions/checkout@v4
     
        - name: setup node js in platform
          uses: actions/setup-node@v4
          with:
                node-version: 24
                cache: npm

        - name: install dependency
          run: npm ci

        - name: run eslint
          run: npm run lint

        - name: make react build 
          run: npm run build

        - name: "configure aws credi"
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-region: ${{secrets.REGION}}
            aws-access-key-id: ${{secrets.ACCESS_KEY}}
            aws-secret-access-key: ${{secrets.SECRET_KEY}}
            
        - name : "upload files on s3"
          run: aws s3 sync ./dist s3://${{secrets.S3BUCKETNAME}} --delete